<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beta Operations | InkWellMedia</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="beta-ux.css"></head><body data-role="admin"><main id="main-content" class="ux-container"><header class="ux-pagehead"><p class="ux-kicker">Operations</p><h1 class="ux-title">Invitations and launch health.</h1><p class="ux-lead">Create controlled invitations and find expired, unused or exhausted links.</p></header><section class="ux-card"><h2>Create member invitation</h2><form id="invite" class="ux-form"><div class="ux-grid two"><label class="ux-field">Restrict to email (recommended)<input name="email" type="email" autocomplete="off"></label><label class="ux-field">Campaign<input name="campaign" value="founding-beta" maxlength="120"></label><label class="ux-field">Maximum registrations<input name="uses" type="number" min="1" max="50" value="1"></label><label class="ux-field">Expires in days<input name="days" type="number" min="1" max="30" value="14"></label></div><button class="ux-primary" type="submit">Create invitation</button><div id="create-status" class="ux-status" hidden tabindex="-1" role="status" aria-live="polite"></div></form></section><section class="ux-card" style="margin-top:20px"><div class="ux-grid two"><label class="ux-field">Search invitations<input id="search" type="search" placeholder="Email or campaign"></label><label class="ux-field">Health filter<select id="filter"><option value="all">All invitations</option><option value="failed">Expired or exhausted</option><option value="unused">Unused</option><option value="active">Active</option></select></label></div><div id="invitations" style="margin-top:18px"><div class="ux-skeleton"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="inkwell-config.js"></script><script src="beta.js"></script><script src="beta-ux.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{let rows=[];const root=document.getElementById('invitations'),q=document.getElementById('search'),filter=document.getElementById('filter'),status=document.getElementById('create-status');function health(i){if(new Date(i.expires_at)<new Date()||i.use_count>=i.max_uses)return'failed';if(i.use_count===0)return'unused';return'active'}function render(){const s=q.value.toLowerCase(),items=rows.filter(i=>(filter.value==='all'||health(i)===filter.value)&&[i.email,i.campaign].join(' ').toLowerCase().includes(s));root.innerHTML=items.length?`<div class="ux-table-wrap"><table class="ux-table"><thead><tr><th>Status</th><th>Audience</th><th>Campaign</th><th>Uses</th><th>Expires</th><th>Next action</th></tr></thead><tbody>${items.map(i=>`<tr><td data-label="Status"><span class="ux-badge ${health(i)==='failed'?'changes':''}">${health(i)}</span></td><td data-label="Audience">${UX.esc(i.email||'Any invited email')}</td><td data-label="Campaign">${UX.esc(i.campaign)}</td><td data-label="Uses">${i.use_count}/${i.max_uses}</td><td data-label="Expires">${new Date(i.expires_at).toLocaleDateString()}</td><td data-label="Next action">${health(i)==='failed'?'Create replacement':'Monitor'}</td></tr>`).join('')}</tbody></table></div>`:UX.empty('No matching invitations','Adjust the search or create a new invitation.')}async function load(){try{rows=(await InkBeta.rpc('get_beta_admin_dashboard')).invitations||[];render()}catch(x){UX.status(status,'error','Invitations could not load. Confirm your admin role.')}}document.getElementById('invite').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.currentTarget),button=e.currentTarget.querySelector('button');button.disabled=true;try{const code=await InkBeta.rpc('create_beta_invitation',{p_kind:'member',p_email:d.get('email')||null,p_creator_user_id:null,p_application_id:null,p_campaign:d.get('campaign'),p_max_uses:Number(d.get('uses')),p_expires_in_days:Number(d.get('days'))}),url=new URL('join-beta.html',location.href);url.searchParams.set('invite',code);UX.status(status,'success','Invitation created. Copy this one-time URL now: '+url.href);await navigator.clipboard?.writeText(url.href);await load()}catch(x){UX.status(status,'error',x.message||'Invitation could not be created.')}finally{button.disabled=false}};q.oninput=render;filter.onchange=render;load()});</script></body></html>
