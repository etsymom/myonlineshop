<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beta Operations | InkWellMedia</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="beta-ux.css"></head><body data-role="admin"><div class="ux-banner">Owner beta operations · Financial controls are not available</div><main id="main-content" class="ux-container"><header class="ux-pagehead"><p class="ux-kicker">Overview</p><h1 class="ux-title">What needs attention today.</h1><p class="ux-lead">Work the queues in priority order without exposing unnecessary member information.</p></header><div id="stats" class="ux-grid"><div class="ux-skeleton"></div><div class="ux-skeleton"></div><div class="ux-skeleton"></div><div class="ux-skeleton"></div></div><section class="ux-card" style="margin-top:20px"><div class="ux-actions" style="justify-content:space-between"><h2>Priority queue</h2><a href="owner-applications.html?previewRole=admin">View applications</a></div><div id="priority"><div class="ux-skeleton"></div></div></section><div id="status" class="ux-status" hidden role="status" aria-live="polite"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="inkwell-config.js"></script><script src="beta.js"></script><script src="beta-ux.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{try{const d=await InkBeta.rpc('get_beta_admin_dashboard'),c=d.counts||{};document.getElementById('stats').innerHTML=[['Pending applications',(d.applications||[]).filter(x=>x.status==='pending').length,'owner-applications.html'],['Approved creators',c.approved_creators||0,'owner-applications.html'],['Registrations',c.registrations||0,'owner-users.html'],['Activated members',c.activated||0,'owner-users.html']].map(x=>`<article class="ux-card"><div class="ux-stat">${x[1]}</div><h2>${x[0]}</h2><a href="${x[2]}?previewRole=admin">Open queue</a></article>`).join('');const pending=(d.applications||[]).filter(x=>x.status==='pending');document.getElementById('priority').innerHTML=pending.length?`<div class="ux-table-wrap"><table class="ux-table"><thead><tr><th>Queue</th><th>Owner</th><th>Date</th><th>Next action</th></tr></thead><tbody>${pending.slice(0,5).map(x=>`<tr><td data-label="Queue">Creator application</td><td data-label="Owner">Unassigned</td><td data-label="Date">${new Date(x.submitted_at).toLocaleDateString()}</td><td data-label="Next action"><a class="ux-primary" href="owner-applications.html?previewRole=admin&focus=${x.id}">Review</a></td></tr>`).join('')}</tbody></table></div>`:UX.empty('No urgent applications','The application queue is clear. Check content reports or invitation failures next.','Check operations','owner-operations.html?previewRole=admin')}catch(x){UX.status(document.getElementById('status'),'error','Could not load operations. Confirm the beta migration and your admin role, then retry.')}});</script></body></html>
