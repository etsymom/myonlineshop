<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Profile | InkWellMedia Beta</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="beta-ux.css"></head><body data-role="member"><main id="main-content" class="ux-container"><header class="ux-pagehead"><p class="ux-kicker">Profile</p><h1 class="ux-title">Your beta preferences.</h1><p class="ux-lead">Help us make discovery more relevant. No financial information is collected here.</p></header><section class="ux-card"><form id="profile-form" class="ux-form"><label class="ux-field">Display name<input name="name" autocomplete="nickname" required><span class="ux-error"></span></label><label class="ux-field">Topics you enjoy<input name="topics" placeholder="Photography, music, tutorials"></label><label class="ux-field">Email updates<select name="updates"><option value="weekly">Weekly beta summary</option><option value="important">Important updates only</option><option value="none">No email updates</option></select></label><button class="ux-primary" type="submit">Save preferences</button><div id="status" class="ux-status" hidden tabindex="-1" role="status" aria-live="polite"></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="inkwell-config.js"></script><script src="beta.js"></script><script src="beta-ux.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const f=document.getElementById('profile-form'),s=document.getElementById('status');UX.persistForm(f,'inkwell_member_profile');f.onsubmit=e=>{e.preventDefault();const name=f.name.value.trim();f.name.setAttribute('aria-invalid',String(!name));f.name.nextElementSibling.textContent=name?'':'Enter the name you would like us to use.';if(!name)return;UX.status(s,'success','Preferences saved on this device.')};});</script></body></html>
