name: Compile Creator Profiles

on:
  push:
    paths:
      - 'profiles/**'
      - 'scripts/compile_profiles.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile profiles
        run: node scripts/compile_profiles.js

      - name: Commit generated output if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/curated_profiles.json
          if [ -d share ]; then
            git add -A share/
          fi
          if git diff --staged --quiet; then
            echo "No changes to compiled output — skipping commit."
          else
            git commit -m "chore: update compiled profiles [skip ci]"
            git push
          fi
