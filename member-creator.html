<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator | InkWellMedia Beta</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="beta-ux.css"></head><body data-role="member"><main id="main-content" class="ux-container"><header id="profile" class="ux-pagehead"><div class="ux-skeleton"></div></header><section><h2>Free previews</h2><div id="previews" class="ux-grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="inkwell-config.js"></script><script src="curated-profiles.js"></script><script src="beta.js"></script><script src="beta-ux.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id');let p;try{p=CuratedProfiles.find((await CuratedProfiles.load()).profiles,id)}catch(_){}const profile=document.getElementById('profile'),root=document.getElementById('previews');if(!p){profile.innerHTML='<h1 class="ux-title">Creator not found</h1>';root.innerHTML=UX.empty('Try Explore','This creator may not be published.','Back to Explore','member-explore.html?previewRole=member');return}await InkBeta.track('creator_profile_view',{creator_id:p.id});profile.innerHTML=`<p class="ux-kicker">${UX.esc(p.niche||'Creator')}</p><h1 class="ux-title">${UX.esc(p.name)}</h1><p class="ux-lead">${UX.esc(p.bio||'')}</p><button id="follow" class="ux-primary" type="button">Follow creator</button>`;document.getElementById('follow').onclick=()=>{let f=JSON.parse(localStorage.getItem('inkwell_following')||'[]');if(!f.includes(p.id))f.push(p.id);localStorage.setItem('inkwell_following',JSON.stringify(f));document.getElementById('follow').textContent='Following ✓'};const media=(p.albums||[]).flatMap(a=>(a.media||[]).filter(m=>m.is_free_preview!==false).map(m=>({...m,a})));root.innerHTML=media.length?'':UX.empty('No previews yet','Follow this creator and check back after their first approved release.');for(const m of media){const c=document.createElement('article'),h=document.createElement('h3');c.className='ux-card';h.textContent=m.a.title;let el;if(m.type==='video'){el=document.createElement('video');el.controls=true;el.preload='metadata'}else{el=document.createElement('img');el.alt=m.a.title+' preview';el.loading='lazy'}el.src=m.src;el.addEventListener(m.type==='video'?'play':'click',()=>InkBeta.track('content_preview_opened',{creator_id:p.id,album_id:m.a.id}),{once:true});const save=document.createElement('button');save.className='ux-ghost';save.textContent='Save preview';save.onclick=()=>{let s=JSON.parse(localStorage.getItem('inkwell_saved')||'[]');s.push({creator:p.id,name:p.name,title:m.a.title});localStorage.setItem('inkwell_saved',JSON.stringify(s.slice(-20)));save.textContent='Saved ✓'};c.append(h,el,save);root.append(c)}});</script><script src="premium-preview.js"></script></body></html>
