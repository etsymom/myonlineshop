<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library | InkWellMedia Beta</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="beta-ux.css"></head><body data-role="member"><main id="main-content" class="ux-container"><header class="ux-pagehead"><p class="ux-kicker">Library</p><h1 class="ux-title">Your saved previews.</h1><p class="ux-lead">Everything you save while exploring, in one place.</p></header><div id="library" class="ux-grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="inkwell-config.js"></script><script src="beta.js"></script><script src="beta-ux.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const items=JSON.parse(localStorage.getItem('inkwell_saved')||'[]'),root=document.getElementById('library');root.innerHTML=items.length?items.map((x,i)=>`<article class="ux-card"><span class="ux-badge">Saved preview</span><h2>${UX.esc(x.title)}</h2><p class="ux-meta">${UX.esc(x.name)}</p><div class="ux-actions"><a class="ux-primary" href="creator-preview.html?id=${encodeURIComponent(x.creator)}&previewRole=member">Open creator</a><button class="ux-ghost" data-remove="${i}">Remove</button></div></article>`).join(''):UX.empty('No saved content yet','Save free previews while exploring and they will appear here.','Explore creators','discover.html?previewRole=member');root.onclick=e=>{if(e.target.dataset.remove==null)return;items.splice(Number(e.target.dataset.remove),1);localStorage.setItem('inkwell_saved',JSON.stringify(items));location.reload()}});</script></body></html>
