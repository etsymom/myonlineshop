<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Applications | InkWellMedia</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="beta-ux.css"></head><body data-role="admin"><main id="main-content" class="ux-container"><header class="ux-pagehead"><p class="ux-kicker">Applications</p><h1 class="ux-title">Review Founding Creators.</h1><p class="ux-lead">Assess fit and readiness, then approve or request clear changes.</p></header><section class="ux-card"><div class="ux-grid two"><label class="ux-field">Search applications<input id="search" type="search" placeholder="Name, email or niche"></label><label class="ux-field">Status<select id="filter"><option value="pending">Pending</option><option value="all">All statuses</option><option value="approved">Approved</option><option value="rejected">Changes requested / rejected</option></select></label></div></section><div id="applications" class="ux-stack" style="margin-top:20px"><div class="ux-skeleton"></div></div><div id="status" class="ux-status" hidden tabindex="-1" role="status" aria-live="polite"></div><dialog id="review-dialog" class="ux-dialog"><form method="dialog" class="ux-dialog-body ux-form"><h2>Request changes</h2><p>Give the creator one clear next action. This beta currently records the application as rejected until a dedicated revision state is deployed.</p><label class="ux-field">Reason<textarea id="review-note" minlength="10" required></textarea></label><div class="ux-actions"><button class="ux-ghost" value="cancel">Cancel</button><button id="confirm-changes" class="ux-danger" value="default">Send request</button></div></form></dialog></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="inkwell-config.js"></script><script src="beta.js"></script><script src="beta-ux.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{let data=[],selected;const root=document.getElementById('applications'),search=document.getElementById('search'),filter=document.getElementById('filter'),status=document.getElementById('status'),dialog=document.getElementById('review-dialog');function render(){const q=search.value.toLowerCase(),items=data.filter(x=>(filter.value==='all'||x.status===filter.value)&&[x.first_name,x.last_name,x.email,x.niche].join(' ').toLowerCase().includes(q));root.innerHTML=items.length?items.map(x=>`<article class="ux-card" id="application-${x.id}"><div class="ux-actions" style="justify-content:space-between"><div><span class="ux-badge ${x.status}">${UX.esc(x.status)}</span><h2>${UX.esc(x.first_name+' '+x.last_name)}</h2><p class="ux-meta">${UX.esc(x.niche)} · Submitted ${new Date(x.submitted_at).toLocaleDateString()}</p></div><div class="ux-actions">${x.status==='pending'?`<button class="ux-primary" data-approve="${x.id}">Approve</button><button class="ux-ghost" data-changes="${x.id}">Request changes</button>`:''}</div></div><p>${UX.esc(x.bio)}</p><a href="${UX.esc(x.portfolio_url||'#')}"${x.portfolio_url?' target="_blank" rel="noopener"':''}>${x.portfolio_url?'Open portfolio':'No portfolio supplied'}</a></article>`).join(''):UX.empty('No matching applications','Clear the search or choose another status.')}try{const d=await InkBeta.rpc('get_beta_admin_dashboard');data=d.applications||[];render()}catch(x){UX.status(status,'error','Applications could not load. Confirm your admin role and staging migration.')}search.oninput=render;filter.onchange=render;root.onclick=async e=>{if(e.target.dataset.approve){try{const code=await InkBeta.rpc('approve_creator_application',{p_application_id:e.target.dataset.approve,p_note:null});UX.status(status,'success','Creator approved. Send this single-use link to the application email: '+new URL('join-beta.html?invite='+encodeURIComponent(code),location.href).href);const x=data.find(a=>a.id===e.target.dataset.approve);if(x)x.status='approved';render()}catch(x){UX.status(status,'error',x.message)}}if(e.target.dataset.changes){selected=e.target.dataset.changes;dialog.showModal()}};document.getElementById('confirm-changes').onclick=async e=>{e.preventDefault();const note=document.getElementById('review-note').value.trim();if(note.length<10)return;try{await InkBeta.rpc('reject_creator_application',{p_application_id:selected,p_note:note});dialog.close();UX.status(status,'success','Change request recorded. Send the creator the review note through the approved beta support channel.');const x=data.find(a=>a.id===selected);if(x)x.status='rejected';render()}catch(x){UX.status(status,'error',x.message)}}});</script></body></html>
