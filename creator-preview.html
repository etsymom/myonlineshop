<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Profile | InkWellMedia</title><meta name="description" content="Creator information, membership benefits and free previews on InkWellMedia."><link rel="canonical" href="https://etsymom.github.io/myonlineshop/creator-preview.html"><link rel="stylesheet" href="beta-ux.css"></head><body data-role="visitor"><main id="main-content" class="ux-container"><div id="profile"><div class="ux-skeleton" style="min-height:220px"></div></div><section style="margin-top:28px"><h2>Free previews</h2><div id="previews" class="ux-grid"><div class="ux-skeleton"></div><div class="ux-skeleton"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="inkwell-config.js"></script><script src="curated-profiles.js"></script><script src="beta.js"></script><script src="beta-ux.js"></script><script>(async()=>{const id=new URLSearchParams(location.search).get('id'),root=document.getElementById('profile'),previews=document.getElementById('previews');let p;try{p=CuratedProfiles.find((await CuratedProfiles.load()).profiles,id)}catch(_){}if(!p){root.innerHTML='<header class="ux-pagehead"><h1 class="ux-title">Creator not found</h1><p class="ux-lead">This profile may not be published yet.</p></header>';previews.innerHTML=UX.empty('Explore other creators','Browse approved Founding Creator profiles.','Back to Explore','discover.html');return}document.title=p.name+' | InkWellMedia';await InkBeta.track('creator_profile_view',{creator_id:p.id});root.innerHTML=`<article class="ux-card"><div class="ux-grid two"><div><p class="ux-kicker">${UX.esc(p.niche||'Founding Creator')}</p><h1 class="ux-title">${UX.esc(p.name)}</h1><p class="ux-lead">${UX.esc(p.bio||'')}</p><div class="ux-actions" style="margin-top:20px"><a class="ux-primary" href="waitlist.html?ref=${encodeURIComponent(p.slug||p.id)}">Request an invitation</a><button class="ux-ghost" id="follow" type="button">Follow creator</button></div></div><aside class="ux-card" style="background:var(--soft);box-shadow:none"><h2>Membership will include</h2><ul><li>New subscriber-only releases</li><li>A library of unlocked creator content</li><li>Updates directly from this creator</li></ul><p class="ux-meta">Payments are disabled during the closed beta.</p></aside></div></article>`;document.getElementById('follow').onclick=()=>{let f=JSON.parse(localStorage.getItem('inkwell_following')||'[]');if(!f.includes(p.id))f.push(p.id);localStorage.setItem('inkwell_following',JSON.stringify(f));document.getElementById('follow').textContent='Following ✓'};const media=(p.albums||[]).flatMap(a=>(a.media||[]).filter(m=>m.is_free_preview!==false).map(m=>({...m,album:a})));if(!media.length){previews.innerHTML=UX.empty('No previews yet','This creator is preparing their first preview. Follow them to find them again.');return}previews.innerHTML='';for(const m of media){const card=document.createElement('article'),h=document.createElement('h3');card.className='ux-card';h.textContent=m.album.title;let el;if(m.type==='video'){el=document.createElement('video');el.controls=true;el.preload='metadata'}else{el=document.createElement('img');el.loading='lazy';el.alt=m.album.title+' preview'}el.src=m.src;el.style.borderRadius='12px';el.addEventListener(m.type==='video'?'play':'click',()=>{InkBeta.track('content_preview_opened',{creator_id:p.id,album_id:m.album.id});let r=JSON.parse(localStorage.getItem('inkwell_recent')||'[]').filter(x=>x.creator!==p.id);r.unshift({creator:p.id,name:p.name,title:m.album.title});localStorage.setItem('inkwell_recent',JSON.stringify(r.slice(0,6)))},{once:true});const save=document.createElement('button');save.className='ux-ghost';save.type='button';save.textContent='Save preview';save.onclick=()=>{let s=JSON.parse(localStorage.getItem('inkwell_saved')||'[]');s.push({creator:p.id,name:p.name,title:m.album.title});localStorage.setItem('inkwell_saved',JSON.stringify(s.slice(-20)));save.textContent='Saved ✓'};card.append(h,el,save);previews.append(card)}})();</script><script src="premium-preview.js"></script></body></html>
