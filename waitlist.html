<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beta Waitlist | InkWellMedia</title><meta name="description" content="Request an invitation to the InkWellMedia closed beta."><link rel="canonical" href="https://etsymom.github.io/myonlineshop/waitlist.html"><meta property="og:title" content="Request an InkWellMedia beta invitation"><meta property="og:description" content="Join a small community testing creator discovery and free previews."><link rel="stylesheet" href="beta-ux.css"></head><body data-role="visitor"><main id="main-content" class="ux-container" style="max-width:720px"><header class="ux-pagehead"><p class="ux-kicker">Invitation request</p><h1 class="ux-title">Join the beta waitlist.</h1><p class="ux-lead">Leave one email address. If a place opens, we will send a unique invitation and explain the next step.</p></header><section class="ux-card"><form id="waitlist" class="ux-form" novalidate><label class="ux-field">Email<input name="email" type="email" autocomplete="email" required><span class="ux-error"></span></label><label class="ux-field">I want to join as<select name="audience"><option value="member">A member discovering creators</option><option value="creator">A creator publishing work</option></select></label><button class="ux-primary" type="submit">Request an invitation</button><div id="status" class="ux-status" hidden tabindex="-1" role="status" aria-live="polite"></div></form><p class="ux-meta">No payment details are collected. Joining the waitlist does not guarantee a place.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="inkwell-config.js"></script><script src="beta.js"></script><script src="beta-ux.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const f=document.getElementById('waitlist'),s=document.getElementById('status'),b=f.querySelector('button');UX.persistForm(f,'inkwell_waitlist_draft');f.onsubmit=async e=>{e.preventDefault();if(!f.email.validity.valid){f.email.setAttribute('aria-invalid','true');f.email.nextElementSibling.textContent='Enter a complete email address.';return}b.disabled=true;try{await InkBeta.rpc('join_beta_waitlist',{p_email:f.email.value,p_audience:f.audience.value,p_attribution:InkBeta.attribution()});localStorage.removeItem('inkwell_waitlist_draft');f.reset();UX.status(s,'success','You are on the waitlist. If a place opens, we will email a unique invitation and clear next steps.')}catch(x){UX.status(s,'error',x.message||'We could not add you. Your email is saved on this device; try again.')}finally{b.disabled=false}}});</script></body></html>
