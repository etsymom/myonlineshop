<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore Creators | InkWellMedia</title><meta name="description" content="Explore independent Founding Creators and free previews on InkWellMedia."><link rel="canonical" href="https://etsymom.github.io/myonlineshop/discover.html"><link rel="stylesheet" href="beta-ux.css"></head><body data-role="visitor"><div class="ux-banner">Closed beta · Browse free previews · No payments</div><main id="main-content" class="ux-container"><header class="ux-pagehead"><p class="ux-kicker">Explore</p><h1 class="ux-title">Find creators worth following.</h1><p class="ux-lead">Search by creator or topic, then open a profile to watch free previews.</p></header><section class="ux-card" aria-label="Creator filters"><label class="ux-field" for="creator-search">Search creators or topics<input class="ux-search" id="creator-search" type="search" autocomplete="off" placeholder="Try photography, music or education"></label><div class="ux-chips" id="categories" aria-label="Categories"></div></section><section style="margin-top:28px"><div class="ux-actions" style="justify-content:space-between;align-items:center"><h2 id="results-title">Featured creators</h2><select id="sort" aria-label="Sort creators" class="ux-search" style="width:auto"><option value="featured">Featured</option><option value="name">Name A–Z</option><option value="newest">Newest</option></select></div><div id="creator-results" class="ux-grid" aria-live="polite"><div class="ux-skeleton"></div><div class="ux-skeleton"></div><div class="ux-skeleton"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="inkwell-config.js"></script><script src="curated-profiles.js"></script><script src="beta.js"></script><script src="beta-ux.js"></script><script>(async()=>{await InkBeta.track('explore_view');const root=document.getElementById('creator-results'),search=document.getElementById('creator-search'),cats=document.getElementById('categories'),sort=document.getElementById('sort');let profiles=[];try{profiles=(await CuratedProfiles.load()).profiles||[]}catch(_){}const categories=['All',...new Set(profiles.map(p=>p.niche).filter(Boolean))];let category='All';cats.innerHTML=categories.map((c,i)=>`<button type="button" class="ux-chip${i?'':' active'}" data-category="${UX.esc(c)}">${UX.esc(c)}</button>`).join('');function render(){let q=search.value.trim().toLowerCase(),items=profiles.filter(p=>(category==='All'||p.niche===category)&&(!q||[p.name,p.niche,p.bio].join(' ').toLowerCase().includes(q)));if(sort.value==='name')items.sort((a,b)=>a.name.localeCompare(b.name));if(sort.value==='newest')items.sort((a,b)=>String(b.published_at).localeCompare(String(a.published_at)));document.getElementById('results-title').textContent=q||category!=='All'?`${items.length} result${items.length===1?'':'s'}`:'Featured creators';if(!items.length){root.innerHTML=UX.empty(profiles.length?'No creators match those filters':'Founding Creators are getting ready',profiles.length?'Try a broader search or choose All categories.':'Join the waitlist and we will tell you when the first profiles are ready.','Join the waitlist','waitlist.html');return}root.innerHTML=items.map(p=>`<article class="ux-card ux-creator"><div class="ux-cover"></div><div class="ux-creator-body">${p.assets?.avatar_src?`<img class="ux-avatar" src="${UX.esc(p.assets.avatar_src)}" alt="">`:''}<span class="ux-badge">${UX.esc(p.niche||'Creator')}</span><h2>${UX.esc(p.name)}</h2><p class="ux-meta">${UX.esc((p.bio||'').slice(0,130))}</p><a class="ux-primary" href="creator-preview.html?id=${encodeURIComponent(p.id)}">View free previews</a></div></article>`).join('')}search.oninput=render;sort.onchange=render;cats.onclick=e=>{if(!e.target.dataset.category)return;category=e.target.dataset.category;cats.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===e.target));render()};render()})();</script></body></html>
