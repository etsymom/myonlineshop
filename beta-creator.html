<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Preview | InkWellMedia Beta</title><meta name="description" content="Approved Founding Creator previews in the private InkWellMedia beta."><meta name="robots" content="noindex,nofollow"><link rel="canonical" href="https://etsymom.github.io/myonlineshop/beta-creator.html"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="beta.css"><style>.preview-media{width:100%;max-height:420px;object-fit:contain;border-radius:12px;background:#15111d}.preview-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}</style></head><body><div id="inkwell-header-mount"></div><div class="beta-banner">Preview-only beta · Paid content remains unavailable</div><main class="beta-shell"><section id="profile" class="beta-hero"><p class="beta-eyebrow">Founding Creator</p><h1 class="ink-h1" id="creator-name">Creator preview</h1><p id="creator-bio">Loading approved previews…</p></section><section id="previews" class="preview-list"></section><p style="margin-top:24px"><a class="beta-button secondary" href="feedback.html?page=beta-creator.html">Report a problem</a></p></main><div id="inkwell-footer-mount"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="inkwell-config.js"></script><script src="inkwell-layout.js"></script><script src="curated-profiles.js"></script><script src="beta.js"></script><script>(async()=>{if(!await InkBeta.requireRole(['member','creator','admin']))return;const id=new URLSearchParams(location.search).get('id'),{profiles}=await CuratedProfiles.load(),p=CuratedProfiles.find(profiles,id),name=document.getElementById('creator-name'),bio=document.getElementById('creator-bio'),list=document.getElementById('previews');if(!p){name.textContent='Creator not found';bio.textContent='Return to Explore and choose an approved creator.';return}document.title=p.name+' | InkWellMedia Beta';name.textContent=p.name;bio.textContent=p.bio||'Creator preview';await InkBeta.track('creator_profile_view',{creator_id:p.id});for(const album of p.albums||[])for(const media of (album.media||[]).filter(m=>m.is_free_preview!==false)){const card=document.createElement('article'),title=document.createElement('h2');card.className='beta-card';title.textContent=album.title;let el;if(media.type==='video'){el=document.createElement('video');el.controls=true;el.preload='metadata'}else{el=document.createElement('img');el.loading='lazy';el.alt=album.title+' preview'}el.src=media.src;el.className='preview-media';el.addEventListener(media.type==='video'?'play':'click',()=>InkBeta.track('content_preview_opened',{creator_id:p.id,album_id:album.id}),{once:true});card.append(title,el);list.append(card)}if(!list.children.length){const empty=document.createElement('p');empty.className='beta-finance-locked';empty.textContent='This creator has no approved previews yet.';list.append(empty)}})().catch(()=>{document.getElementById('creator-bio').textContent='Creator preview could not be loaded.'});</script></body></html>
