<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report a Problem | InkWellMedia</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="beta-ux.css"></head><body data-role="visitor"><main id="main-content" class="ux-container" style="max-width:760px"><header class="ux-pagehead"><p class="ux-kicker">Beta feedback</p><h1 class="ux-title">Tell us what went wrong.</h1><p class="ux-lead">Include what you tried, what happened and what you expected. Never include passwords or private content links.</p></header><section class="ux-card"><form id="feedback" class="ux-form"><label class="ux-field">Category<select name="category"><option value="bug">Something is broken</option><option value="content">Content issue</option><option value="safety">Safety or abuse</option><option value="accessibility">Accessibility</option><option value="idea">Suggestion</option><option value="other">Other</option></select></label><label class="ux-field">Email (optional)<input name="email" type="email" autocomplete="email"></label><label class="ux-field">Page URL<input name="page" type="url"></label><label class="ux-field">What happened?<textarea name="message" minlength="10" maxlength="4000" required></textarea><span class="ux-error"></span></label><button class="ux-primary" type="submit">Send report</button><div id="status" class="ux-status" hidden tabindex="-1" role="status" aria-live="polite"></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="inkwell-config.js"></script><script src="beta.js"></script><script src="beta-ux.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const f=document.getElementById('feedback'),s=document.getElementById('status'),b=f.querySelector('button');UX.persistForm(f,'inkwell_feedback_draft');if(!f.page.value)f.page.value=new URLSearchParams(location.search).get('page')||document.referrer||location.href;f.onsubmit=async e=>{e.preventDefault();if(f.message.value.trim().length<10){f.message.setAttribute('aria-invalid','true');f.message.nextElementSibling.textContent='Add a little more detail so we can investigate.';return}b.disabled=true;try{await InkBeta.rpc('submit_beta_feedback',{p_email:f.email.value,p_category:f.category.value,p_page_url:f.page.value,p_message:f.message.value});localStorage.removeItem('inkwell_feedback_draft');f.reset();UX.status(s,'success','Report received. It is now in the owner review queue. Thank you for helping improve the beta.')}catch(x){UX.status(s,'error',x.message||'Your report could not be sent. Your details are saved; try again shortly.')}finally{b.disabled=false}}});</script></body></html>
