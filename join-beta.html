<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join the Beta | InkWellMedia</title><meta name="description" content="Invitation-only registration and login for InkWellMedia."><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="beta-ux.css"></head><body data-role="visitor"><div class="ux-banner">Invitation-only beta · Payments disabled</div><main id="main-content" class="ux-container" style="max-width:680px"><header class="ux-pagehead"><p class="ux-kicker">Beta access</p><h1 class="ux-title">Join or return.</h1><p class="ux-lead">New here? Use your invitation. Returning member? Sign in and continue where you left off.</p></header><section class="ux-card"><div class="ux-actions" role="tablist" aria-label="Account access"><button id="signup-tab" class="ux-primary" role="tab" aria-selected="true">Create account</button><button id="login-tab" class="ux-ghost" role="tab" aria-selected="false">Sign in</button></div><form id="join-form" class="ux-form" style="margin-top:20px" novalidate><label id="invite-label" class="ux-field">Invitation code<input name="invite" autocomplete="one-time-code" required><span class="ux-hint">Found in the private link sent by InkWellMedia or a Founding Creator.</span><span class="ux-error"></span></label><label class="ux-field">Email<input name="email" type="email" autocomplete="email" required><span class="ux-error"></span></label><label class="ux-field">Password<input name="password" type="password" autocomplete="new-password" minlength="10" required><span class="ux-hint">Use at least 10 characters.</span><span class="ux-error"></span></label><button id="submit" class="ux-primary" type="submit">Create beta account</button><div id="status" class="ux-status" hidden tabindex="-1" role="status" aria-live="polite"></div><button id="resend" class="ux-ghost" type="button" hidden>Resend confirmation email</button></form><p><a href="forgot-password.html">Forgot your password?</a> · <a href="waitlist.html">Need an invitation?</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="inkwell-config.js"></script><script src="beta.js"></script><script src="beta-ux.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{let mode='signup';const f=document.getElementById('join-form'),invite=f.invite,label=document.getElementById('invite-label'),button=document.getElementById('submit'),status=document.getElementById('status'),signup=document.getElementById('signup-tab'),login=document.getElementById('login-tab');UX.persistForm(f,'inkwell_join_draft');const query=new URLSearchParams(location.search);invite.value=query.get('invite')||InkBeta.attribution().invite_code||invite.value;if(query.get('reason')==='session-expired')UX.status(status,'error','Your session expired. Sign in again to continue.');if(query.get('error')==='confirmation')UX.status(status,'error','The confirmation link is invalid or expired. Use Resend confirmation after entering your email.');function setMode(v){mode=v;label.hidden=v==='login';invite.required=v==='signup';button.textContent=v==='signup'?'Create beta account':'Sign in';f.password.autocomplete=v==='signup'?'new-password':'current-password';signup.setAttribute('aria-selected',String(v==='signup'));login.setAttribute('aria-selected',String(v==='login'))}signup.onclick=()=>setMode('signup');login.onclick=()=>setMode('login');document.getElementById('resend').onclick=async()=>{const email=f.email.value.trim();if(!email||!f.email.validity.valid){UX.status(status,'error','Enter the email used to register first.');return}try{const x=await InkBeta.client().auth.resend({type:'signup',email,options:{emailRedirectTo:new URL('auth-redirect.html',location.href).href}});if(x.error)throw x.error;UX.status(status,'success','Confirmation email resent. Check spam or junk if it does not arrive.')}catch(x){UX.status(status,'error',x.message)}};f.onsubmit=async e=>{e.preventDefault();for(const el of f.querySelectorAll('.ux-error'))el.textContent='';let valid=true;if(mode==='signup'&&!invite.value.trim()){invite.setAttribute('aria-invalid','true');invite.parentElement.querySelector('.ux-error').textContent='Open your invitation link or paste the code here.';valid=false}if(!f.email.validity.valid){f.email.setAttribute('aria-invalid','true');f.email.parentElement.querySelector('.ux-error').textContent='Enter a complete email address.';valid=false}if(f.password.value.length<10){f.password.setAttribute('aria-invalid','true');f.password.parentElement.querySelector('.ux-error').textContent='Password must contain at least 10 characters.';valid=false}if(!valid)return;button.disabled=true;try{const sb=InkBeta.client();if(mode==='signup'){await InkBeta.track('member_signup_started');const v=await InkBeta.rpc('validate_beta_invitation',{p_code:invite.value.trim(),p_email:f.email.value.trim()});if(!v?.valid){const messages={used:'This invitation has already been used. Ask the administrator for a new one.',expired:'This invitation has expired. Ask the administrator for a new one.',email_mismatch:'This invitation was issued to a different email address.',invalid:'This invitation is not valid.'};throw new Error(messages[v?.reason]||messages.invalid)}const r=await sb.auth.signUp({email:f.email.value.trim(),password:f.password.value,options:{emailRedirectTo:new URL('auth-redirect.html',location.href).href,data:{invite_code:invite.value.trim(),attribution:InkBeta.attribution()}}});if(r.error)throw r.error;if(r.data.user?.identities?.length===0)throw new Error('This email is already registered. Sign in or reset your password.');await InkBeta.track('member_signup_completed');localStorage.removeItem('inkwell_join_draft');if(!r.data.session){UX.status(status,'success','Account created. Check your email, confirm the account, then return here to sign in.');setMode('login');document.getElementById('resend').hidden=false;return}}else{const r=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.password.value});if(r.error)throw r.error}const role=await InkBeta.role();const home={member:'member-home.html',creator:'creator-studio.html',admin:'owner-overview.html'}[role];if(!home)throw new Error('This account does not have a beta role. Contact the beta administrator.');location.assign(home)}catch(x){UX.status(status,'error',x.message||'We could not complete that request. Try again.')}finally{button.disabled=false}}});</script></body></html>
