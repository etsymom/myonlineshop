<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Launch Link | InkWellMedia</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="beta-ux.css"></head><body data-role="creator"><main id="main-content" class="ux-container"><header class="ux-pagehead"><p class="ux-kicker">Audience launch</p><h1 class="ux-title">Invite your first supporters.</h1><p class="ux-lead">Build one clear, attributed invitation link from a code issued by the beta administrator.</p></header><div class="ux-grid two"><section class="ux-card"><form id="share" class="ux-form"><label class="ux-field">Creator reference<input name="ref" maxlength="80" required></label><label class="ux-field">Member invitation code<input name="invite" maxlength="80" required></label><label class="ux-field">Campaign name<input name="campaign" maxlength="80" value="founding-creator-launch" required></label><button class="ux-primary" type="submit">Build invitation link</button></form></section><section class="ux-card"><h2>Ready to share</h2><p>“Join me on the InkWellMedia closed beta and help shape my subscriber community.”</p><label class="ux-field">Invitation URL<input id="url" readonly></label><div class="ux-actions"><button id="copy" class="ux-primary">Copy link</button><button id="native" class="ux-ghost">Share</button></div><div id="status" class="ux-status" hidden role="status" aria-live="polite"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="inkwell-config.js"></script><script src="beta.js"></script><script src="beta-ux.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const f=document.getElementById('share'),out=document.getElementById('url'),s=document.getElementById('status');UX.persistForm(f,'inkwell_share_draft');f.onsubmit=e=>{e.preventDefault();const u=new URL('join-beta.html',location.href);u.searchParams.set('invite',f.invite.value);u.searchParams.set('ref',f.ref.value);u.searchParams.set('utm_source','creator');u.searchParams.set('utm_medium','referral');u.searchParams.set('utm_campaign',f.campaign.value);out.value=u.href;UX.status(s,'success','Link ready. Open it in a private window before sharing.')};document.getElementById('copy').onclick=async()=>{if(!out.value)return UX.status(s,'error','Build a link first.');await navigator.clipboard.writeText(out.value);UX.status(s,'success','Invitation link copied.')};document.getElementById('native').onclick=async()=>{if(!out.value)return UX.status(s,'error','Build a link first.');if(navigator.share)await navigator.share({title:'Join my InkWellMedia beta community',url:out.value});else await navigator.clipboard.writeText(out.value)}});</script></body></html>
