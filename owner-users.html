<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beta Users | InkWellMedia</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="beta-ux.css"></head><body data-role="admin"><main id="main-content" class="ux-container"><header class="ux-pagehead"><p class="ux-kicker">Users</p><h1 class="ux-title">Beta registrations.</h1><p class="ux-lead">Operational identifiers only—emails and private profile data are intentionally omitted.</p></header><label class="ux-field ux-card">Search registration ID<input id="search" type="search" placeholder="Paste a user or invitation ID"></label><div id="users" style="margin-top:20px"><div class="ux-skeleton"></div></div><div id="status" class="ux-status" hidden role="status" aria-live="polite"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="inkwell-config.js"></script><script src="beta.js"></script><script src="beta-ux.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{let rows=[];const root=document.getElementById('users'),q=document.getElementById('search');function mask(v){return v?String(v).slice(0,8)+'…':'—'}function render(){const s=q.value.toLowerCase(),x=rows.filter(r=>!s||[r.user_id,r.invitation_id].join(' ').toLowerCase().includes(s));root.innerHTML=x.length?`<div class="ux-table-wrap"><table class="ux-table"><thead><tr><th>User reference</th><th>Invitation</th><th>Registered</th><th>Next action</th></tr></thead><tbody>${x.map(r=>`<tr><td data-label="User">${mask(r.user_id)}</td><td data-label="Invitation">${mask(r.invitation_id)}</td><td data-label="Registered">${new Date(r.registered_at).toLocaleString()}</td><td data-label="Next action"><a href="feedback.html">Review feedback</a></td></tr>`).join('')}</tbody></table></div>`:UX.empty('No registrations found','New invited members will appear here after email confirmation.')}try{rows=(await InkBeta.rpc('get_beta_admin_dashboard')).registrations||[];render()}catch(x){UX.status(document.getElementById('status'),'error','Registrations could not load.')}q.oninput=render});</script></body></html>
